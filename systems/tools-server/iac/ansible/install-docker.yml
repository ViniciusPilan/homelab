---
- name: Install Docker Engine on the tools server
  hosts: tools
  become: true
  gather_facts: true

  vars:
    docker_apt_arch: "{{ 'amd64' if ansible_architecture == 'x86_64' else 'arm64' if ansible_architecture == 'aarch64' else ansible_architecture }}"
    docker_apt_keyring: /etc/apt/keyrings/docker.asc

  tasks:
    - name: Install packages required to use the Docker apt repository
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
        state: present
        update_cache: true

    - name: Create apt keyrings directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Download Docker's official signing key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: "{{ docker_apt_keyring }}"
        mode: "0644"

    - name: Configure the Docker apt repository
      ansible.builtin.apt_repository:
        repo: >-
          deb [arch={{ docker_apt_arch }} signed-by={{ docker_apt_keyring }}]
          https://download.docker.com/linux/ubuntu
          {{ ansible_distribution_release }} stable
        filename: docker
        state: present
        update_cache: true

    - name: Install Docker Engine and Docker Compose plugin
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: true

    - name: Ensure Docker starts at boot and is running
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Add the SSH user to the docker group
      ansible.builtin.user:
        name: "{{ ansible_user | default(ansible_user_id) }}"
        groups: docker
        append: true
