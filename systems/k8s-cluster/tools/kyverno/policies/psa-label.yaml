apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: enforce-pod-security-admission-via-namespace
spec:
  evaluation:
    admission:
      enabled: true
    mutateExisting:
      enabled: true

  matchConstraints:
    resourceRules:
      - apiGroups:
          - ""
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - namespaces

  matchConditions:
    - name: exclude-system-namespaces
      expression: |
        ![
          "kube-system",
          "kube-public",
          "kube-node-lease",
          "kyverno",
          "istio-system"
        ].exists(n, n == object.metadata.name)

  mutations:
    - patchType: ApplyConfiguration
      applyConfiguration:
        expression: |
          Object{
            metadata: Object.metadata{
              labels: {
                "pod-security.kubernetes.io/enforce": "baseline",
                "pod-security.kubernetes.io/audit": "restricted"
              }
            }
          }
