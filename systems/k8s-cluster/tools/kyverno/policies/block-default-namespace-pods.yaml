apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: block-default-namespace-pods
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: block-pods-in-default
      skipBackgroundRequests: true
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - default
      validate:
        allowExistingViolations: true
        message: "Pods are not allowed in the default namespace."
        deny: {}
