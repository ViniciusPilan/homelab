apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: enforce-istio-injection-via-namespace
spec:
  evaluation:
    admission:
      enabled: true
    mutateExisting:
      enabled: true

  matchConstraints:
    resourceRules:
      - apiGroups:
          - ""
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - namespaces

  variables:
    - name: istioNamespaces
      # Add namespace names here to enable Istio sidecar injection.
      expression: '["monitoring", "app"]'

  mutations:
    - patchType: ApplyConfiguration
      applyConfiguration:
        expression: |
          Object{
            metadata: Object.metadata{
              labels: {
                "istio-injection": variables.istioNamespaces.exists(namespace, namespace == object.metadata.name) ? "enabled" : "disabled"
              }
            }
          }
