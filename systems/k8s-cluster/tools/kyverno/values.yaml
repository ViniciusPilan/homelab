  dnsPolicy: ClusterFirst

  # -- `dnsConfig` allows to specify DNS configuration for the pod.
  # For further reference: https://kubernetes.io/docs/concepts/services-networking/dns-pod-service/#pod-dns-config.
  dnsConfig: {}
    # options:
    #   - name: ndots
