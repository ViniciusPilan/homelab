# Full chart values for Popeye version 0.3.0: https://github.com/adnoctem/charts/blob/popeye-0.3.0/charts/popeye/values.yaml
serviceAccount:
  automount: true

cronjob:
  schedule: "0 */1 * * *"

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

popeye:
  args:
    # Keep the Job successful even when Popeye reports lint findings.
    force-exit-zero: false
