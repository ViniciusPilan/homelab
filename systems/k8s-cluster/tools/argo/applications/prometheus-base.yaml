apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus-base
  namespace: argocd
spec:
  project: default

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 91.5.2
      helm:
        releaseName: prometheus-base
        valueFiles:
          - $values/systems/k8s-cluster/tools/prometheus-base/values.yaml

    - repoURL: https://github.com/ViniciusPilan/homelab.git
      targetRevision: main
      ref: values

  syncPolicy:
    # automated:
    #   prune: true
    #   selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
