apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: garage
  namespace: argocd
spec:
  project: default

  destination:
    server: https://kubernetes.default.svc
    namespace: garage

  sources:
    - repoURL: https://datahub-local.github.io/garage-helm
      chart: garage
      targetRevision: 0.8.0
      helm:
        releaseName: garage
        valueFiles:
          - $values/systems/k8s-cluster/tools/garage/values.yaml

    - repoURL: https://github.com/ViniciusPilan/homelab.git
      targetRevision: main
      ref: values

  syncPolicy:
    # automated:
    #   prune: true
    #   selfHeal: true
    syncOptions:
      - CreateNamespace=true
