kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
networking:
  # Cilium is installed as the cluster CNI.
  disableDefaultCNI: true
nodes:
  - role: control-plane
    labels:
      role: control-plane
      ingress-ready: "true"

  - role: k8s-worker01
  - role: k8s-worker02
  - role: k8s-worker03
  - role: k8s-worker04
