---
- name: Bootstrap the k0s controller and create worker join token
  hosts: "{{ groups['controlplane'][0] }}"
  become: true
  gather_facts: false
  vars:
    k0s_config_path: /etc/k0s/k0s.yaml
  tasks:
    - name: Create k0s configuration directory
      ansible.builtin.file:
        path: /etc/k0s
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Install cluster configuration
      ansible.builtin.copy:
        dest: "{{ k0s_config_path }}"
        owner: root
        group: root
        mode: "0600"
        content: |
          apiVersion: k0s.k0sproject.io/v1beta1
          kind: ClusterConfig
          metadata:
            name: homelab
          spec:
            api:
              externalAddress: 192.168.12.31
              sans:
                - 192.168.12.31
            network:
              provider: custom
              podCIDR: 10.244.0.0/16
              serviceCIDR: 10.96.0.0/12

    - name: Install the k0s controller service
      ansible.builtin.command:
        argv:
          - /usr/local/bin/k0s
          - install
          - controller
          - --config={{ k0s_config_path }}
          - --disable-components=metrics-server
      args:
        creates: /etc/systemd/system/k0scontroller.service

    - name: Enable and start the k0s controller service
      ansible.builtin.systemd:
        name: k0scontroller
        enabled: true
        state: started
        daemon_reload: true

    - name: Wait for the k0s controller to become ready
      ansible.builtin.command: /usr/local/bin/k0s status
      register: k0s_status
      until: k0s_status.rc == 0
      retries: 30
      delay: 10
      changed_when: false

    - name: Create a worker join token
      ansible.builtin.command:
        argv:
          - /usr/local/bin/k0s
          - token
          - create
          - --role=worker
          - --expiry=2h
      register: k0s_worker_token
      changed_when: false
      no_log: true

    - name: Store worker token as a run-scoped controller fact
      ansible.builtin.set_fact:
        k0s_worker_join_token: "{{ k0s_worker_token.stdout }}"
      no_log: true

- name: Join k0s workers
  hosts: workers
  become: true
  gather_facts: false
  vars:
    k0s_bootstrap_host: "{{ groups['controlplane'][0] }}"
  tasks:
    - name: Create k0s configuration directory
      ansible.builtin.file:
        path: /etc/k0s
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Write worker join token
      ansible.builtin.copy:
        content: "{{ hostvars[k0s_bootstrap_host].k0s_worker_join_token }}\n"
        dest: /etc/k0s/worker-token
        owner: root
        group: root
        mode: "0600"
      no_log: true

    - name: Install worker service using the join token
      ansible.builtin.command:
        argv:
          - /usr/local/bin/k0s
          - install
          - worker
          - --token-file=/etc/k0s/worker-token
      args:
        creates: /etc/systemd/system/k0sworker.service
      register: k0s_worker_install
      no_log: true

    - name: Enable and start worker service
      ansible.builtin.systemd:
        name: k0sworker
        enabled: true
        state: started
        daemon_reload: true
