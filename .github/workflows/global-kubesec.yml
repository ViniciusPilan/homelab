name: Validate Kubernetes manifests with Kubesec

on:
  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: Scan Kubernetes manifests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan supported workload manifests with Kubesec
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python -m pip install pyyaml
          python - <<'PY'
          import os
          import pathlib
          import subprocess
          import sys
          import tempfile

          import yaml

          workload_kinds = {
              "Pod",
              "Deployment",
              "DaemonSet",
              "StatefulSet",
              "Job",
              "CronJob",
              "ReplicaSet",
          }

          if os.environ["EVENT_NAME"] == "pull_request":
              changed = subprocess.check_output(
                  [
                      "git", "diff", "--name-only", "--diff-filter=ACMRT",
                      f"{os.environ['BASE_SHA']}...{os.environ['HEAD_SHA']}",
                  ],
                  text=True,
              ).splitlines()
              yaml_files = [
                  path for path in changed
                  if path.startswith("systems/k8s-cluster/tools/")
                  and pathlib.PurePosixPath(path).suffix in {".yaml", ".yml"}
                  and pathlib.Path(path).is_file()
              ]
          else:
              yaml_files = [
                  path.as_posix()
                  for path in pathlib.Path("systems/k8s-cluster/tools").rglob("*")
                  if path.is_file() and path.suffix in {".yaml", ".yml"}
              ]

          if not yaml_files:
              print("No changed YAML files to inspect.")
              sys.exit(0)

          with tempfile.TemporaryDirectory() as scan_dir:
              scan_files = []
              for source in yaml_files:
                  try:
                      with open(source, encoding="utf-8") as stream:
                          documents = list(yaml.safe_load_all(stream))
                  except yaml.YAMLError as error:
                      print(f"Skipping invalid YAML file {source}: {error}")
                      continue

                  for index, document in enumerate(documents, start=1):
                      if not isinstance(document, dict):
                          continue
                      kind = document.get("kind")
                      if kind not in workload_kinds:
                          print(
                              f"Skipping {source} document {index} "
                              f"(kind: {kind or 'unknown'})."
                          )
                          continue

                      output = pathlib.Path(scan_dir) / f"manifest-{len(scan_files) + 1}.yaml"
                      with output.open("w", encoding="utf-8") as stream:
                          yaml.safe_dump(document, stream, sort_keys=False)
                      scan_files.append(output.name)

              if not scan_files:
                  print("No supported workload manifests to scan.")
                  sys.exit(0)

              result = subprocess.run(
                  [
                      "docker", "run", "--rm",
                      "-v", f"{scan_dir}:/scan:ro",
                      "kubesec/kubesec:v2",
                      "scan", *(f"/scan/{name}" for name in scan_files),
                      "--format", "table",
                  ]
              )

              if result.returncode:
                  print(
                      f"Kubesec scan failed with exit code {result.returncode}.",
                      file=sys.stderr,
                  )
                  sys.exit(result.returncode)
          PY
