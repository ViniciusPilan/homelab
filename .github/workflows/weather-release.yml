name: Release weather app

on:
  push:
    branches:
      - main
    paths:
      - "internal-tools/weather/**"
      - ".release-please-manifest.json"
      - "release-please-config.json"
      - ".github/workflows/weather-release.yml"

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    name: Create or update release PR
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create or update release PR
        id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    name: Publish ${{ matrix.component }}
    needs: release
    if: needs.release.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: api
            context: internal-tools/weather/api
          - component: app-frontend
            context: internal-tools/weather/app-frontend

    steps:
      - name: Check out released version
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag_name }}

      - name: Normalize image owner
        id: owner
        run: echo "value=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.value }}/weather-${{ matrix.component }}:${{ needs.release.outputs.version }}
            ghcr.io/${{ steps.owner.outputs.value }}/weather-${{ matrix.component }}:sha-${{ github.sha }}
            ghcr.io/${{ steps.owner.outputs.value }}/weather-${{ matrix.component }}:latest
          labels: |
            org.opencontainers.image.version=${{ needs.release.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Print image pull command
        run: echo "docker pull ghcr.io/${{ steps.owner.outputs.value }}/weather-${{ matrix.component }}:${{ needs.release.outputs.version }}"
